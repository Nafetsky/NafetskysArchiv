name: Test Fandom Sync

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq html2text

      - name: Make scripts executable
        run: |
          chmod +x .github/workflows/scripts/changes.sh
          chmod +x .github/workflows/scripts/store-pages.sh

      - name: Sync Fandom
        run: |
          set -euo pipefail

          WIKI_URL="https://nafetskys-archiv.fandom.com/de"
          METADATA_FILE="fandom-metadata.yml"
          CHANGES_FILE="${RUNNER_TEMP}/fandom-changes.ndjson"

          LAST_RCID=0

          if [[ -f "$METADATA_FILE" ]]; then
            STORED_RCID="$(
              awk -F ':' '
                /^[[:space:]]*rcid[[:space:]]*:/ {
                  gsub(/[[:space:]]/, "", $2)
                  print $2
                  exit
                }
              ' "$METADATA_FILE"
            )"

            if [[ "$STORED_RCID" =~ ^[0-9]+$ ]]; then
              LAST_RCID="$STORED_RCID"
            fi
          fi

          echo "Starting sync after rcid: $LAST_RCID"

          .github/workflows/scripts/changes.sh             "$WIKI_URL"             "$LAST_RCID"           | tee "$CHANGES_FILE"           | .github/workflows/scripts/store-pages.sh               "$WIKI_URL"               export

          NEW_RCID="$(
            jq -r 'select(.type == "cursor") | .rcid' "$CHANGES_FILE"               | tail -n 1
          )"

          if [[ ! "$NEW_RCID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: changes.sh did not return a valid cursor." >&2
            exit 1
          fi

          cat > "$METADATA_FILE" <<EOF
          fandom:
            url: "$WIKI_URL"
            rcid: $NEW_RCID
          EOF

          echo "Sync finished at rcid: $NEW_RCID"

      - name: Commit and push
        run: |
          set -euo pipefail

          NEW_RCID="$(
            awk -F ':' '
              /^[[:space:]]*rcid[[:space:]]*:/ {
                gsub(/[[:space:]]/, "", $2)
                print $2
                exit
              }
            ' fandom-metadata.yml
          )"

          git config user.name "Fandom Sync Bot"
          git config user.email "fandom-sync@users.noreply.github.com"

          git add export fandom-metadata.yml

          if git diff --cached --quiet; then
            echo "Nothing changed; no commit necessary."
            exit 0
          fi

          git commit -m "Sync Fandom to rcid ${NEW_RCID}"
          git push
